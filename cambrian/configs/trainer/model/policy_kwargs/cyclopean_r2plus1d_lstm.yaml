# Shared per-eye R(2+1)D retina, motor-conditioned cyclopean fusion, and one LSTM.
features_extractor_class:
  _target_: cambrian.ml.features_extractors.MjCambrianCyclopeanR2Plus1DExtractor
  _partial_: true
features_extractor_kwargs:
  normalized_image: true

  # Same retinal encoder as the successful feed-forward R(2+1)D condition.
  stem_channels: 24
  block_channels: [32, 48, 48]
  temporal_channels: 32
  latent_channels: 24
  norm_groups: 8
  code_mode: signed_silu

  # Stacked action/eye-state/contact history conditions both eye maps before fusion.
  motor_hidden_dim: 128
  motor_context_dim: 64
  fusion_hidden_dim: 256
  cyclopean_dim: 192
  film_conditioning: true

# Keep this true because SB3 validates feature-extractor classes only on the
# normalize_images=false path. Float [0,1] retinas are not divided by 255, because
# SB3 does not classify their Box spaces as uint8 images.
normalize_images: true
share_features_extractor: true

# Preserve the zero-initialized FiLM identity map. SB3 orthogonal initialization
# would otherwise overwrite it.
ortho_init: false
activation_fn:
  _target_: torch.nn.SiLU
  _partial_: true

# The custom policy concatenates c_t (192) and h_t (128) before these trunks.
net_arch:
  pi: [128, 64]
  vf: [128, 64]

lstm_hidden_size: 128
n_lstm_layers: 1
use_current_features_skip: true
