defaults:
  - agent

# Point agent with actuated pan/tilt eye(s). The action space has two body
# commands plus the eye commands: 4D for one/yoked eye pair, 6D for independent
# binocular pan/tilt. The body is otherwise identical to `point`.
instance:
  _target_: cambrian.agents.MjCambrianAgentPointEye
  _partial_: true

xml:
  _target_: cambrian.utils.cambrian_xml.MjCambrianXML.parse
  _convert_: all
  xml_string: ${read:${path:${package:},models,agents,point.xml}}

body_name: "${parent:}_body"
geom_name: "${parent:}_geom"
