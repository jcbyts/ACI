defaults:
  - multi_eye

# Two forward-facing actuated eyes. This mirrors the known-good binocular fixed-eye
# geometry from the single-eye investigation, then adds pan/tilt gimbals to each eye.
num_eyes: [1, 2]
lat_range: [0, 0]
lon_range: [-15, 15]
gaze_lat_range: [0, 0]
gaze_lon_range: [0, 0]

fov: [45, 45]
resolution: [20, 20]

# Applied to each procedurally generated child eye by multi_eye._single_eye.
actuated: true
pan_range: [-45, 45]
tilt_range: [-30, 30]
actuator_kp: 0.5
joint_damping: 0.1

# Keep sensor realism off for the first actuated-eye baseline.
noise_std: 0
integration_factor: 0

flatten_observations: false
