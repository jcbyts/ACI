defaults:
  - eye

# A single (monocular) eye mounted on a 2-DOF pan/tilt gimbal. Used by the M2
# actuated-eye agent to decouple gaze from locomotion (4D action space).
instance:
  _target_: cambrian.eyes.eye.MjCambrianEye
  _partial_: true

# Forward-facing eye with a modest resolution so the rendered view is informative.
resolution: [20, 20]
coord: [0, 0]

# Enable the gimbal. Pan/tilt limits in degrees; servo stiffness / joint damping tuned
# for a stable saccade-and-hold response.
actuated: true
pan_range: [-60, 60]
tilt_range: [-40, 40]
actuator_kp: 0.5
joint_damping: 0.1

# M2 isolates the DOF change from sensor effects: keep sensors off.
noise_std: 0
integration_factor: 0
