# @package _global_

# Same recurrent model as the fixed-eye test, with independent binocular pan/tilt
# control and physical eye-state observations.
defaults:
  - tracking_2eye_recurrent_fixed
  - override /env/agents@env.agents.agent: point_yaw_rate_eye
  - override /env/agents/eyes@env.agents.agent.eyes.eye: binocular_matched_actuated

expname: tracking_2eye_cyclopean_recurrent_actuated_seed${seed}

env:
  agents:
    agent:
      eye_action_mode: independent
      use_action_obs: true
      use_eye_state_obs: true
