# @package _global_

# Recurrent infrastructure test built directly on the successful fixed-eye yaw-rate
# condition. The ten-frame stack stays enabled and is consumed by the R(2+1)D retina.
defaults:
  - tracking_2eye_mlp_fixed
  - override /env/agents@env.agents.agent: point_yaw_rate
  - override /env/agents/eyes@env.agents.agent.eyes.eye: binocular_matched_fixed
  - override /trainer/model: recurrent_ppo

expname: tracking_2eye_cyclopean_recurrent_fixed_seed${seed}

trainer:
  callbacks:
    eval_callback:
      callback_after_eval:
        callbacks:
          stop_training_on_no_improvement_callback:
            min_evals: 10
            max_no_improvement_evals: 20
