# @package _global_

# Stage-1 actuated-eye training: keep the gimballed eyes centered so the 6D policy
# first learns body pursuit with the same observation/action shape used after unfreezing.
env:
  mazes:
    maze:
      floor_texture: checker
      floor_texrepeat: [10, 10]

trainer:
  wrappers:
    constant_action_wrapper:
      constant_actions:
        2: 0
        3: 0
        4: 0
        5: 0
